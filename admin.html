<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharvi – Executive Admin Command</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --rose: #c9967a; --rose-dark: #a87560; --text: #2c211d; --cream: #fdf8f5; }
  body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--text); padding: 20px; }
  .container { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
  h2, h3 { margin-bottom: 20px; color: var(--rose-dark); border-bottom: 2px solid var(--cream); padding-bottom: 10px; }
  .form-group { margin-bottom: 15px; }
  label { display: block; font-weight: 500; margin-bottom: 5px; }
  input, select { width: 100%; padding: 12px; border: 1px solid #f0d8cc; border-radius: 10px; }
  button { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--rose), var(--rose-dark)); color: white; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .tabs { display: flex; gap: 15px; margin-bottom: 20px; }
  .tab-btn { background: #faf4f1; color: var(--text); border: 1px solid var(--rose-light); border-radius: 10px; padding: 10px; margin: 0; }
  .tab-btn.active { background: var(--rose-dark); color: white; }
  .item-card { background: var(--cream); padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .danger-btn { background: #e57373; width: auto; padding: 6px 15px; font-size: 13px; margin: 0; border-radius: 6px; }
</style>
</head>
<body>

<div class="container" id="lock-screen">
  <h2>Sharvi Admin Security Lock</h2>
  <div class="form-group">
    <label>Secret Control Passcode</label>
    <input type="password" id="admin-code" placeholder="••••••••">
  </div>
  <button onclick="unlockConsole()">Verify Identity</button>
</div>

<div class="container" id="admin-dashboard" style="display: none;">
  <h2>Store Command Center</h2>
  
  <div class="tabs">
    <button class="tab-btn active" id="btn-tab-inv" onclick="switchView('inventory')">Manage Inventory</button>
    <button class="tab-btn" id="btn-tab-ord" onclick="switchView('orders')">Customer Orders</button>
  </div>

  <div id="view-inventory">
    <h3 id="form-title">Add/Edit Product</h3>
    <input type="hidden" id="edit-id">
    <div class="form-group"><label>Product Title</label><input type="text" id="p-name"></div>
    <div class="form-group"><label>Subtext / Detail</label><input type="text" id="p-sub"></div>
    <div class="form-group"><label>Category</label><select id="p-cat"><option value="rings">Rings</option><option value="earrings">Earrings</option><option value="necklaces">Necklaces</option></select></div>
    <div class="form-group"><label>Product Image URL</label><input type="text" id="p-img" placeholder="Paste link"></div>
    <div class="form-group"><label>Selling Price (₹)</label><input type="number" id="p-price"></div>
    <div class="form-group"><label>MRP (₹)</label><input type="number" id="p-mrp"></div>
    <button id="save-btn" onclick="commitProduct()">Publish Product to Live Shelf</button>

    <h3 style="margin-top:40px;">Active Catalog</h3>
    <div id="catalog-list">Loading live cloud products...</div>
  </div>

  <div id="view-orders" style="display: none;">
    <h3>Incoming Real-time Orders</h3>
    <div id="orders-list">No incoming orders yet.</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://hmmsspdpcjtcpocoftem.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "sb_publishable_N_aGTOro_rgN6gXdieDunw_1lPgX7TY";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function unlockConsole() {
  if(document.getElementById('admin-code').value === "SHARVI2026") {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('admin-dashboard').style.display = 'block';
    syncInventory();
    syncOrders();
  } else { alert("Access Denied."); }
}

function switchView(view) {
  document.getElementById('view-inventory').style.display = view === 'inventory' ? 'block' : 'none';
  document.getElementById('view-orders').style.display = view === 'orders' ? 'block' : 'none';
  document.getElementById('btn-tab-inv').classList.toggle('active', view === 'inventory');
  document.getElementById('btn-tab-ord').classList.toggle('active', view === 'orders');
}

async function syncInventory() {
  const { data, error } = await supabase.from('products').select('*').order('id', {ascending: false});
  if(error) return;
  document.getElementById('catalog-list').innerHTML = data.map(p => `
    <div class="item-card">
      <div><b>${p.name}</b><br><span style="font-size:12px; color:gray;">Price: ₹${p.price} | Cat: ${p.cat}</span></div>
      <div style="display:flex; gap:10px;">
        <button class="danger-btn" style="background:#4fc3f7;" onclick='populateEditForm(${JSON.stringify(p)})'>Edit</button>
        <button class="danger-btn" onclick="removeProduct(${p.id})">Delete</button>
      </div>
    </div>
  `).join('') || "Shelf is empty.";
}

async function commitProduct() {
  const id = document.getElementById('edit-id').value;
  const payload = {
    name: document.getElementById('p-name').value,
    sub: document.getElementById('p-sub').value,
    cat: document.getElementById('p-cat').value,
    image: document.getElementById('p-img').value,
    price: parseInt(document.getElementById('p-price').value),
    mrp: parseInt(document.getElementById('p-mrp').value)
  };

  if(id) { await supabase.from('products').update(payload).eq('id', id); }
  else { await supabase.from('products').insert([payload]); }

  // Clear Form
  document.getElementById('edit-id').value = "";
  document.getElementById('p-name').value = ""; document.getElementById('p-sub').value = "";
  document.getElementById('p-img').value = ""; document.getElementById('p-price').value = ""; document.getElementById('p-mrp').value = "";
  document.getElementById('form-title').innerText = "Add/Edit Product";
  document.getElementById('save-btn').innerText = "Publish Product to Live Shelf";
  
  syncInventory();
}

function populateEditForm(p) {
  document.getElementById('edit-id').value = p.id;
  document.getElementById('p-name').value = p.name;
  document.getElementById('p-sub').value = p.sub;
  document.getElementById('p-cat').value = p.cat;
  document.getElementById('p-img').value = p.image;
  document.getElementById('p-price').value = p.price;
  document.getElementById('p-mrp').value = p.mrp;
  document.getElementById('form-title').innerText = "Modifying: " + p.name;
  document.getElementById('save-btn').innerText = "Update Cloud Records";
}

async function removeProduct(id) {
  if(confirm("Delete product permanently?")) {
    await supabase.from('products').delete().eq('id', id);
    syncInventory();
  }
}

async function syncOrders() {
  const { data, error } = await supabase.from('orders').select('*').order('id', {ascending: false});
  if(error) return;
  document.getElementById('orders-list').innerHTML = data.map(o => `
    <div style="background:#faf4f1; padding:15px; border-radius:12px; margin-bottom:10px; border-left:4px solid var(--rose-dark);">
      <b>Order ID: #${o.id}</b><br>
      <span>Client: ${o.customer_name} (${o.customer_email})</span><br>
      <span>Products: <mark>${o.product_name}</mark></span><br>
      <span>Collected: <b>₹${o.amount_paid}</b></span>
    </div>
  `).join('') || "No logged sales.";
}
</script>
</body>
</html>
