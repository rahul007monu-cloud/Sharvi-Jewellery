<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#c9967a">
<title>Sharvi – Premium Resin Jewellery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<style>
:root {
  --rose: #c9967a; --rose-dark: #a87560; --rose-light: #f0d8cc; --rose-pale: #faf4f1;
  --text: #2c211d; --text-light: #7a5c52; --white: #ffffff;
  --shadow: 0 8px 24px rgba(180,120,100,0.1); --radius: 18px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height:100%; background:var(--cream); font-family:'Jost',sans-serif; color:var(--text); overscroll-behavior:none; }
#app { max-width:430px; margin:0 auto; min-height:100vh; background:var(--white); position:relative; overflow-x:hidden; box-shadow: 0 0 40px rgba(0,0,0,0.05); }

.page { display:none; min-height:100vh; padding-bottom:90px; }
.page.active { display:block; animation: fadeUp 0.4s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }

.btn-primary { width:100%; padding:15px; background:linear-gradient(135deg, var(--rose), var(--rose-dark)); color:#fff; border:none; border-radius:50px; font-family:'Jost',sans-serif; font-size:15px; font-weight:600; cursor:pointer; box-shadow:0 8px 25px rgba(201, 150, 122, 0.4); }
.btn-outline { width:100%; padding:14px; background:transparent; color:var(--rose-dark); border:1.5px solid var(--rose); border-radius:50px; font-family:'Jost',sans-serif; font-size:15px; font-weight:600; cursor:pointer; }

.auth-wrapper { padding: 40px 20px; display:flex; flex-direction:column; justify-content:center; min-height:100vh; background:linear-gradient(160deg, #fdf8f5 0%, #faf4f1 100%); text-align: center; }
.auth-header h1 { font-family:'Cormorant Garamond',serif; font-size:48px; background:linear-gradient(135deg, #a87560, #d4a96a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:10px;}

.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:rgba(255,255,255,0.98); border-top:1px solid var(--rose-light); display:none; justify-content:space-around; align-items:center; padding:12px 0 20px; z-index:100; }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.nav-item span { font-size:10px; color:var(--text-light); font-weight:500; }
.nav-item.active span { color:var(--rose); }

.page-header { display:flex; align-items:center; justify-content:space-between; padding:20px 20px 15px; position:sticky; top:0; background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); z-index:50; border-bottom:1px solid var(--rose-pale);}
.page-header h2 { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:600; color:var(--text); }
.product-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:20px; }
.product-card { background:var(--white); border-radius:var(--radius); padding:15px; border:1px solid var(--rose-pale); text-align:center; }

.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(44, 33, 29, 0.95); color:#fff; padding:14px 24px; border-radius:50px; font-size:13px; opacity:0; transition:all 0.3s; pointer-events:none; z-index:999; }
.toast.show { opacity:1; }
</style>
</head>
<body>

<form name="sharvi_orders" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="customer_name" id="form_name">
  <input type="email" name="customer_email" id="form_email">
  <input type="text" name="product_ordered" id="form_product">
  <input type="text" name="amount" id="form_amount">
</form>

<div id="app">

  <div id="auth-page" class="page active">
    <div class="auth-wrapper">
      <div class="auth-header">
        <h1>Sharvi</h1>
        <p style="color:var(--text-light); font-size:16px; margin-bottom: 40px;">Handcrafted Resin Magic</p>
      </div>
      
      <button class="btn-primary" onclick="netlifyIdentity.open()">Login / Register to Shop</button>
      <p style="margin-top:20px; font-size:13px; color:var(--text-light);">Secure authentication powered by Netlify</p>
    </div>
  </div>

  <div id="home-page" class="page">
    <div class="page-header">
      <h2 style="font-family:'Cormorant Garamond'; font-size:30px; background:linear-gradient(135deg, #a87560, #d4a96a); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Sharvi</h2>
    </div>
    <div style="padding:20px;">
      <h3>Exquisite Resin Collection</h3>
      <p style="color:var(--text-light); font-size:14px; margin-top:5px;">Click below to place a direct order:</p>
    </div>
    <div class="product-grid">
      <div class="product-card">🌸<br><b>Rose Ring</b><br>₹499<br><br><button class="btn-primary" style="padding:5px; font-size:12px;" onclick="placeOrder('Rose Ring', '499')">Buy Now</button></div>
      <div class="product-card">🌊<br><b>Ocean Pendant</b><br>₹699<br><br><button class="btn-primary" style="padding:5px; font-size:12px;" onclick="placeOrder('Ocean Pendant', '699')">Buy Now</button></div>
    </div>
  </div>

  <div id="profile-page" class="page">
    <div class="page-header"><h2>My Profile</h2></div>
    <div style="padding:30px 20px; text-align:center;">
      <div style="font-size:60px; margin-bottom:10px;">👤</div>
      <h3 id="display-name" style="font-family:'Cormorant Garamond'; font-size:28px;">Customer</h3>
      <p id="display-email" style="color:var(--text-light); font-size:14px; margin-bottom:30px;">email</p>
      <button class="btn-outline" style="border-color:#e57373; color:#e57373;" onclick="netlifyIdentity.logout()">Logout</button>
    </div>
  </div>

  <nav class="bottom-nav" id="main-nav">
    <div class="nav-item active" onclick="showPage('home-page', this)"><span>Home</span></div>
    <div class="nav-item" onclick="showPage('profile-page', this)"><span>Profile</span></div>
  </nav>

</div>

<div class="toast" id="toast"></div>

<script>
let currentUser = null;

// Initialize Netlify Identity
if (window.netlifyIdentity) {
  window.netlifyIdentity.on("init", user => {
    if (!user) {
      window.netlifyIdentity.on("login", () => { document.location.href = "/"; });
    } else {
      handleUserLogin(user);
    }
  });

  window.netlifyIdentity.on("login", user => {
    handleUserLogin(user);
    netlifyIdentity.close();
  });

  window.netlifyIdentity.on("logout", () => {
    currentUser = null;
    document.getElementById('main-nav').style.display = 'none';
    showPage('auth-page');
    showToast("Logged out successfully");
  });
}

function handleUserLogin(user) {
  currentUser = user;
  document.getElementById('main-nav').style.display = 'flex';
  
  // Set Profile Details
  document.getElementById('display-name').innerText = user.user_metadata.full_name || "Valued Customer";
  document.getElementById('display-email').innerText = user.email;
  
  showPage('home-page');
  showToast("Welcome to Sharvi! 🎉");
}

function placeOrder(productName, price) {
  if(!currentUser) {
    showToast("Please login first!");
    return;
  }

  showToast("Sending Order...");

  // Fill the hidden form with real data
  const formData = new FormData();
  formData.append("form-name", "sharvi_orders");
  formData.append("customer_name", currentUser.user_metadata.full_name || "Customer");
  formData.append("customer_email", currentUser.email);
  formData.append("product_ordered", productName);
  formData.append("amount", price);

  // Send the form data to Netlify silently via JS
  fetch("/", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams(formData).toString()
  })
  .then(() => showToast(`Order Confirmed for ${productName}! ✅`))
  .catch((error) => showToast("Order failed. Please try again."));
}

function showPage(pageId, navElement = null) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  if(navElement) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    navElement.classList.add('active');
  }
  window.scrollTo(0,0);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
